name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binaries
        run: |
          mkdir -p builds
          GOOS=linux GOARCH=amd64 go build -o builds/ding-linux-amd64
          GOOS=darwin GOARCH=amd64 go build -o builds/ding-darwin-amd64
          GOOS=darwin GOARCH=arm64 go build -o builds/ding-darwin-arm64
          GOOS=windows GOARCH=amd64 go build -o builds/ding-windows-amd64.exe

      - name: Create archives
        run: |
          cd builds
          tar -czvf ding-linux-amd64.tar.gz ding-linux-amd64
          tar -czvf ding-darwin-amd64.tar.gz ding-darwin-amd64
          tar -czvf ding-darwin-arm64.tar.gz ding-darwin-arm64
          zip ding-windows-amd64.zip ding-windows-amd64.exe
          sha256sum ding-* > checksums.txt
          cd ..

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            builds/ding-linux-amd64.tar.gz
            builds/ding-darwin-amd64.tar.gz
            builds/ding-darwin-arm64.tar.gz
            builds/ding-windows-amd64.zip
            builds/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
